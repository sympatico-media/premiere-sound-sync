[package]
name = "studio-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable dark, macOS-style Slint components for small desktop media tools."
links = "studio_ui"
build = "build.rs"

[dependencies]
slint = { workspace = true, features = ["unstable-winit-030", "renderer-skia"] }
rfd.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics"] }
