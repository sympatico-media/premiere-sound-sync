[workspace]
resolver = "2"
members = ["crates/studio-ui", "crates/premiere-sound-sync-core", "apps/premiere-sound-sync"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
slint = "1.18"
slint-build = "1.18"
rfd = "0.18"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
flate2 = "1.1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
rustfft = "6"
